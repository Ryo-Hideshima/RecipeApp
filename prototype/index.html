<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レシピ共有アプリ プロトタイプ</title>
<style>
  :root{
    --bg:#f7f5f2; --card:#fff; --fg:#2b2b2b; --muted:#8a8378;
    --accent:#e8734a; --accent-d:#cf5c36; --line:#e7e2da; --chip:#efe9e1;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
    line-height:1.6}
  a{color:inherit;text-decoration:none}
  img{max-width:100%}
  button{font:inherit;cursor:pointer}

  header.app{position:sticky;top:0;z-index:20;background:rgba(247,245,242,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:14px;
    padding:10px 16px}
  .logo{font-weight:800;font-size:19px;color:var(--accent-d);letter-spacing:.5px}
  .bar nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
  .bar nav a{padding:7px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
  .bar nav a.active{background:var(--accent);color:#fff}
  .bar nav a:hover{color:var(--fg)}

  main{max-width:960px;margin:0 auto;padding:20px 16px 80px}
  h1{font-size:22px;margin:.2em 0 .6em}
  h2{font-size:16px;margin:1.4em 0 .5em}
  .muted{color:var(--muted);font-size:13px}

  .btn{background:var(--accent);color:#fff;border:0;border-radius:10px;
    padding:10px 18px;font-weight:700}
  .btn:hover{background:var(--accent-d)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
  .btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}

  input,textarea,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--fg)}
  label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column}
  .card .thumb{aspect-ratio:4/3;background:linear-gradient(135deg,#f3c9a8,#e8734a)}
  .card .body{padding:10px 12px}
  .card .title{font-weight:700;font-size:15px}
  .card .meta{display:flex;justify-content:space-between;align-items:center;
    margin-top:6px;font-size:12px;color:var(--muted)}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;
    padding:6px 12px;font-size:13px;color:var(--muted)}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chip.tag{background:#fff}

  .search{display:flex;gap:8px;margin-bottom:6px}

  .auth{max-width:360px;margin:6vh auto;background:#fff;border:1px solid var(--line);
    border-radius:var(--radius);padding:26px}
  .auth h1{text-align:center}

  .detail-hero{aspect-ratio:16/10;border-radius:var(--radius);
    background:linear-gradient(135deg,#f3c9a8,#e8734a);margin-bottom:14px}
  .detail-hero.small{aspect-ratio:16/6}
  .row{display:flex;gap:14px;align-items:center}
  .ing-list li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);
    padding:7px 0}
  ol.steps{padding-left:0;list-style:none;counter-reset:s}
  ol.steps li{counter-increment:s;display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  ol.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;
    background:var(--accent);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px}

  .avatar{width:44px;height:44px;border-radius:50%;flex:none;
    background:linear-gradient(135deg,#b7d3c2,#6ea988)}
  .avatar.lg{width:76px;height:76px}
  .avatar.sm{width:30px;height:30px}

  .comment{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .fav{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:#fff;border-radius:999px;padding:8px 14px;font-weight:700}
  .fav.on{background:#ffe9e0;border-color:var(--accent);color:var(--accent-d)}

  .userrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .stat{display:flex;gap:22px;margin:10px 0}
  .stat b{font-size:16px}
  .stat span{color:var(--muted);font-size:13px}

  .list-inline{display:flex;gap:8px;align-items:end}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:#2b2b2b;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;
    opacity:0;transition:.3s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .backlink{display:inline-block;margin-bottom:10px;color:var(--muted);font-size:13px}
  .empty{text-align:center;color:var(--muted);padding:50px 0}
</style>
</head>
<body>
<header class="app">
  <div class="bar">
    <a href="#/recipes" class="logo">🍳 Recipe</a>
    <nav id="nav"></nav>
  </div>
</header>
<main id="view"></main>
<div class="toast" id="toast"></div>

<script>
// ---------- モックデータ ----------
const CATEGORIES = ["和食","洋食","中華","デザート","麺類","サラダ","朝食","お弁当"];
const users = [
  {id:1,name:"はるか",bio:"週末は作り置き。和食多めです。",following:[2,3],followers:[2]},
  {id:2,name:"ケンタ",bio:"時短レシピ研究中。",following:[1],followers:[1,3]},
  {id:3,name:"みお",bio:"お菓子作りが趣味 🍰",following:[2],followers:[1]},
];
let currentUser = 1; // ログイン中ユーザー(プロト用に固定)
let loggedIn = true;

const recipes = [
  {id:1,userId:1,title:"basicの肉じゃが",cats:["和食"],favs:[2,3],
   ingredients:[["牛こま切れ肉","200g"],["じゃがいも","3個"],["玉ねぎ","1個"],["にんじん","1本"],["しょうゆ","大さじ3"],["砂糖","大さじ2"]],
   steps:["野菜を一口大に切る。","鍋で肉を炒め、色が変わったら野菜を加える。","水と調味料を入れて落とし蓋で15分煮る。","火を止めて10分置き、味を染み込ませる。"],
   comments:[{userId:2,text:"落とし蓋のコツ参考になりました！"},{userId:3,text:"砂糖少し減らして作りました🙆"}]},
  {id:2,userId:2,title:"5分でできる痩せ味噌スープ",cats:["和食","朝食"],favs:[1],
   ingredients:[["乾燥わかめ","2g"],["豆腐","1/2丁"],["味噌","大さじ1"],["だしの素","小さじ1"]],
   steps:["鍋に水400mlとだしの素を入れ火にかける。","豆腐とわかめを加える。","火を止めて味噌を溶く。"],
   comments:[{userId:1,text:"忙しい朝に助かる〜"}]},
  {id:3,userId:3,title:"濃厚ガトーショコラ",cats:["デザート","洋食"],favs:[1,2],
   ingredients:[["チョコレート","100g"],["バター","60g"],["卵","2個"],["砂糖","60g"],["薄力粉","30g"]],
   steps:["チョコとバターを湯煎で溶かす。","卵と砂糖をよく混ぜる。","1と2を合わせ、粉をふるい入れる。","170℃のオーブンで25分焼く。"],
   comments:[]},
  {id:4,userId:1,title:"鶏むね肉のさっぱり南蛮",cats:["和食","お弁当"],favs:[],
   ingredients:[["鶏むね肉","1枚"],["片栗粉","適量"],["酢","大さじ2"],["しょうゆ","大さじ2"],["砂糖","大さじ1"]],
   steps:["鶏肉を削ぎ切りにして片栗粉をまぶす。","フライパンで両面焼く。","合わせ調味料を絡める。"],
   comments:[{userId:2,text:"タルタルも足したい"}]},
  {id:5,userId:2,title:"シンプル塩ラーメン",cats:["麺類","中華"],favs:[3],
   ingredients:[["中華麺","1玉"],["鶏がらスープの素","小さじ2"],["塩","小さじ1/2"],["ねぎ","適量"]],
   steps:["スープの材料をどんぶりに入れ熱湯を注ぐ。","麺を茹でて湯切りし加える。","ねぎをのせる。"],
   comments:[]},
  {id:6,userId:3,title:"彩り豊かなコブサラダ",cats:["サラダ","洋食"],favs:[1],
   ingredients:[["レタス","1/4個"],["トマト","1個"],["ゆで卵","1個"],["アボカド","1/2個"],["鶏ハム","50g"]],
   steps:["具材を全て角切りにする。","器に彩りよく並べる。","ドレッシングをかける。"],
   comments:[{userId:1,text:"見た目が華やか！お客さん用にいいね"}]},
];

// ---------- ユーティリティ ----------
const $ = s => document.querySelector(s);
const nameOf = id => (users.find(u=>u.id===id)||{}).name || "不明";
const userById = id => users.find(u=>u.id===id);
const recipeById = id => recipes.find(r=>r.id===id);
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function go(hash){location.hash=hash;}

// ---------- ナビ ----------
function renderNav(){
  const path = location.hash || "#/recipes";
  const items = loggedIn
    ? [["#/recipes","レシピ"],["#/recipe/new","投稿"],["#/users","ユーザー検索"],
       ["#/favorites","お気に入り"],["#/profile/"+currentUser,"マイページ"],["#logout","ログアウト"]]
    : [["#/recipes","レシピ"],["#/login","ログイン"],["#/register","新規登録"]];
  $("#nav").innerHTML = items.map(([h,l])=>{
    const active = path.startsWith(h) && h!=="#logout" ? "active":"";
    return `<a href="${h}" class="${active}">${l}</a>`;
  }).join("");
}

// ---------- 画面 ----------
const views = {};

views.login = () => `
  <div class="auth">
    <h1>ログイン</h1>
    <label>メールアドレス</label><input type="email" value="haruka@example.com">
    <label>パスワード</label><input type="password" value="password">
    <div style="margin-top:18px"><button class="btn" style="width:100%" onclick="doLogin()">ログイン</button></div>
    <p class="muted" style="text-align:center;margin-top:16px">
      アカウントがない方は <a href="#/register" style="color:var(--accent-d);font-weight:700">新規登録</a></p>
  </div>`;

views.register = () => `
  <div class="auth">
    <h1>新規登録</h1>
    <label>メールアドレス</label><input type="email" placeholder="you@example.com">
    <label>パスワード</label><input type="password" placeholder="8文字以上">
    <label>表示名</label><input type="text" placeholder="キッチンネーム">
    <div style="margin-top:18px"><button class="btn" style="width:100%" onclick="doLogin()">登録する</button></div>
    <p class="muted" style="text-align:center;margin-top:16px">
      すでに登録済みの方は <a href="#/login" style="color:var(--accent-d);font-weight:700">ログイン</a></p>
  </div>`;

let listState = {q:"",cat:null};
views.recipes = () => {
  let list = recipes.slice().reverse();
  const q = listState.q.trim();
  if(q) list = list.filter(r =>
    r.title.includes(q) || r.ingredients.some(i=>i[0].includes(q)));
  if(listState.cat) list = list.filter(r=>r.cats.includes(listState.cat));
  return `
  <h1>レシピ一覧</h1>
  <div class="search">
    <input id="q" placeholder="キーワード・材料名で検索" value="${esc(listState.q)}"
      oninput="listState.q=this.value" onkeydown="if(event.key==='Enter')render()">
    <button class="btn" onclick="render()">検索</button>
  </div>
  <div class="chips">
    <button class="chip ${!listState.cat?'on':''}" onclick="listState.cat=null;render()">すべて</button>
    ${CATEGORIES.map(c=>`<button class="chip ${listState.cat===c?'on':''}"
      onclick="listState.cat=(listState.cat==='${c}'?null:'${c}');render()">${c}</button>`).join("")}
  </div>
  ${loggedIn?`<p><a class="btn sm" href="#/recipe/new">＋ レシピを投稿</a></p>`:""}
  ${list.length? `<div class="grid">${list.map(cardHTML).join("")}</div>`
    : `<div class="empty">該当するレシピがありません</div>`}`;
};

function cardHTML(r){
  return `<a class="card" href="#/recipe/${r.id}">
    <div class="thumb"></div>
    <div class="body">
      <div class="title">${esc(r.title)}</div>
      <div class="meta">
        <span onclick="event.preventDefault();go('#/profile/${r.userId}')">@${esc(nameOf(r.userId))}</span>
        <span>♡ ${r.favs.length}・💬 ${r.comments.length}</span>
      </div>
    </div></a>`;
}

views.recipeDetail = (id) => {
  const r = recipeById(+id);
  if(!r) return `<div class="empty">レシピが見つかりません</div>`;
  const isOwner = loggedIn && r.userId===currentUser;
  const faved = loggedIn && r.favs.includes(currentUser);
  return `
  <a class="backlink" href="#/recipes">← 一覧へ戻る</a>
  <div class="detail-hero"></div>
  <div class="row" style="justify-content:space-between">
    <h1 style="margin:0">${esc(r.title)}</h1>
    ${isOwner?`<div class="list-inline">
      <a class="btn sm ghost" href="#/recipe/${r.id}/edit">編集</a>
      <button class="btn sm ghost" onclick="delRecipe(${r.id})">削除</button></div>`:""}
  </div>
  <div class="chips">${r.cats.map(c=>`<span class="chip tag">${c}</span>`).join("")}</div>
  <div class="row" style="margin:12px 0">
    <div class="avatar sm" onclick="go('#/profile/${r.userId}')"></div>
    <a href="#/profile/${r.userId}"><b>${esc(nameOf(r.userId))}</b></a>
  </div>
  <button class="fav ${faved?'on':''}" onclick="toggleFav(${r.id})">
    ${faved?'♥ お気に入り済み':'♡ お気に入り'} (${r.favs.length})</button>

  <h2>材料</h2>
  <ul class="ing-list" style="list-style:none;padding:0">
    ${r.ingredients.map(i=>`<li><span>${esc(i[0])}</span><span class="muted">${esc(i[1])}</span></li>`).join("")}
  </ul>

  <h2>手順</h2>
  <ol class="steps">${r.steps.map(s=>`<li><div>${esc(s)}</div></li>`).join("")}</ol>

  <h2>コメント (${r.comments.length})</h2>
  ${loggedIn?`<div class="list-inline" style="margin:8px 0 4px">
    <input id="cmt" placeholder="コメントを書く">
    <button class="btn sm" onclick="addComment(${r.id})">送信</button></div>`
    :`<p class="muted">コメントするには <a href="#/login" style="color:var(--accent-d)">ログイン</a> が必要です</p>`}
  ${r.comments.map(c=>`<div class="comment">
    <div class="avatar sm" onclick="go('#/profile/${c.userId}')"></div>
    <div><a href="#/profile/${c.userId}"><b>${esc(nameOf(c.userId))}</b></a>
    <div>${esc(c.text)}</div></div></div>`).join("") || `<p class="muted">まだコメントはありません</p>`}`;
};

let form = null;
views.recipeForm = (id) => {
  const editing = id!=null;
  const r = editing ? recipeById(+id) : null;
  form = r ? JSON.parse(JSON.stringify(r))
    : {title:"",cats:[],ingredients:[["",""]],steps:[""],favs:[],comments:[],userId:currentUser};
  return `
  <a class="backlink" href="${editing?'#/recipe/'+id:'#/recipes'}">← 戻る</a>
  <h1>${editing?'レシピを編集':'レシピを投稿'}</h1>

  <label>タイトル</label>
  <input value="${esc(form.title)}" oninput="form.title=this.value">

  <label>写真</label>
  <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px">
    <div class="card"><div class="thumb"></div></div>
    <div class="card" style="display:grid;place-items:center;min-height:90px;color:var(--muted)">＋ 追加</div>
  </div>

  <label>カテゴリ(複数選択可)</label>
  <div class="chips">${CATEGORIES.map(c=>`<button class="chip ${form.cats.includes(c)?'on':''}"
    onclick="toggleCat('${c}')">${c}</button>`).join("")}</div>

  <label>材料</label>
  <div id="ings">${form.ingredients.map((i,idx)=>ingRow(i,idx)).join("")}</div>
  <button class="btn sm ghost" onclick="form.ingredients.push(['','']);renderForm()">＋ 材料を追加</button>

  <label style="margin-top:16px">手順</label>
  <div id="steps">${form.steps.map((s,idx)=>stepRow(s,idx)).join("")}</div>
  <button class="btn sm ghost" onclick="form.steps.push('');renderForm()">＋ 手順を追加</button>

  <div style="margin-top:24px">
    <button class="btn" onclick="saveRecipe(${editing?id:'null'})">保存する</button>
  </div>`;
};
function ingRow(i,idx){return `<div class="list-inline" style="margin:6px 0">
  <input placeholder="材料名" value="${esc(i[0])}" oninput="form.ingredients[${idx}][0]=this.value">
  <input placeholder="分量" style="max-width:120px" value="${esc(i[1])}" oninput="form.ingredients[${idx}][1]=this.value">
  <button class="btn sm ghost" onclick="form.ingredients.splice(${idx},1);renderForm()">×</button></div>`;}
function stepRow(s,idx){return `<div class="list-inline" style="margin:6px 0">
  <span class="muted" style="padding-top:10px">${idx+1}.</span>
  <textarea rows="2" oninput="form.steps[${idx}]=this.value">${esc(s)}</textarea>
  <button class="btn sm ghost" onclick="form.steps.splice(${idx},1);renderForm()">×</button></div>`;}

views.profile = (id) => {
  const u = userById(+id);
  if(!u) return `<div class="empty">ユーザーが見つかりません</div>`;
  const isMe = loggedIn && u.id===currentUser;
  const me = userById(currentUser);
  const isFollowing = loggedIn && me.following.includes(u.id);
  const mine = recipes.filter(r=>r.userId===u.id).reverse();
  return `
  <div class="row" style="gap:18px">
    <div class="avatar lg"></div>
    <div>
      <h1 style="margin:.1em 0">${esc(u.name)}</h1>
      <div class="muted">${esc(u.bio)}</div>
    </div>
  </div>
  <div class="stat">
    <a href="#/profile/${u.id}/following"><b>${u.following.length}</b> <span>フォロー中</span></a>
    <a href="#/profile/${u.id}/followers"><b>${u.followers.length}</b> <span>フォロワー</span></a>
  </div>
  ${isMe? `<div class="list-inline">
      <button class="btn sm ghost">プロフィール編集</button>
      <a class="btn sm ghost" href="#/favorites">お気に入り一覧</a></div>`
    : (loggedIn?`<button class="btn sm ${isFollowing?'ghost':''}" onclick="toggleFollow(${u.id})">
        ${isFollowing?'フォロー中':'＋ フォロー'}</button>`:"")}

  <h2>投稿レシピ (${mine.length})</h2>
  ${mine.length?`<div class="grid">${mine.map(cardHTML).join("")}</div>`:`<p class="muted">まだ投稿がありません</p>`}`;
};

views.followList = (id,kind) => {
  const u = userById(+id);
  const ids = kind==="followers" ? u.followers : u.following;
  const me = userById(currentUser);
  return `
  <a class="backlink" href="#/profile/${id}">← ${esc(u.name)} のプロフィール</a>
  <h1>${kind==="followers"?"フォロワー":"フォロー中"}</h1>
  ${ids.length? ids.map(uid=>userRow(uid,me)).join("") : `<div class="empty">ユーザーがいません</div>`}`;
};

function userRow(uid,me){
  const u = userById(uid);
  const following = me.following.includes(uid);
  const self = uid===currentUser;
  return `<div class="userrow">
    <div class="avatar" onclick="go('#/profile/${uid}')"></div>
    <div style="flex:1" onclick="go('#/profile/${uid}')">
      <b>${esc(u.name)}</b><div class="muted">${esc(u.bio)}</div></div>
    ${self?"":`<button class="btn sm ${following?'ghost':''}" onclick="toggleFollow(${uid})">
      ${following?'フォロー中':'＋ フォロー'}</button>`}</div>`;
}

let userQ = "";
views.users = () => {
  const me = userById(currentUser);
  const res = userQ.trim()? users.filter(u=>u.name.includes(userQ.trim())) : users;
  return `
  <h1>ユーザー検索</h1>
  <div class="search">
    <input placeholder="表示名で検索" value="${esc(userQ)}"
      oninput="userQ=this.value" onkeydown="if(event.key==='Enter')render()">
    <button class="btn" onclick="render()">検索</button>
  </div>
  ${res.map(u=>userRow(u.id,me)).join("")}`;
};

views.favorites = () => {
  const list = recipes.filter(r=>r.favs.includes(currentUser)).reverse();
  return `
  <h1>お気に入り一覧</h1>
  ${list.length? `<div class="grid">${list.map(cardHTML).join("")}</div>`
    : `<div class="empty">お気に入り登録したレシピはまだありません</div>`}`;
};

// ---------- アクション ----------
function doLogin(){loggedIn=true;currentUser=1;toast("ログインしました");go("#/recipes");}
function doLogout(){loggedIn=false;toast("ログアウトしました");go("#/recipes");}
function toggleFav(id){
  if(!loggedIn){toast("ログインが必要です");return go("#/login");}
  const r=recipeById(id);const i=r.favs.indexOf(currentUser);
  i<0?r.favs.push(currentUser):r.favs.splice(i,1);
  toast(i<0?"お気に入りに追加":"お気に入りを解除");render();
}
function toggleFollow(uid){
  const me=userById(currentUser);const i=me.following.indexOf(uid);
  const tgt=userById(uid);
  if(i<0){me.following.push(uid);tgt.followers.push(currentUser);toast("フォローしました");}
  else{me.following.splice(i,1);tgt.followers.splice(tgt.followers.indexOf(currentUser),1);toast("フォロー解除しました");}
  render();
}
function addComment(id){
  const v=$("#cmt").value.trim();if(!v)return;
  recipeById(id).comments.push({userId:currentUser,text:v});render();
}
function delRecipe(id){
  if(!confirm("このレシピを削除しますか?"))return;
  const i=recipes.findIndex(r=>r.id===id);recipes.splice(i,1);
  toast("削除しました");go("#/recipes");
}
function toggleCat(c){
  const i=form.cats.indexOf(c);i<0?form.cats.push(c):form.cats.splice(i,1);renderForm();
}
function renderForm(){
  // 再描画(入力保持のため form は保持)
  const id = location.hash.match(/recipe\/(\d+)\/edit/);
  $("#view").innerHTML = views.recipeForm(id?id[1]:null);
}
function saveRecipe(id){
  if(!form.title.trim()){toast("タイトルを入力してください");return;}
  form.ingredients = form.ingredients.filter(i=>i[0].trim());
  form.steps = form.steps.filter(s=>s.trim());
  if(id==null||id==="null"){
    const nid = Math.max(...recipes.map(r=>r.id))+1;
    form.id=nid;recipes.push(form);toast("投稿しました");go("#/recipe/"+nid);
  }else{
    const idx=recipes.findIndex(r=>r.id===+id);
    recipes[idx]={...recipes[idx],...form,id:+id};
    toast("更新しました");go("#/recipe/"+id);
  }
}

// ---------- ルーター ----------
function render(){
  const hash = location.hash || "#/recipes";
  if(hash==="#logout"){doLogout();return;}
  renderNav();
  const v = $("#view");
  let m;
  const authed = h => { if(!loggedIn){go("#/login");return false;} return true; };

  if(hash.startsWith("#/login")) v.innerHTML = views.login();
  else if(hash.startsWith("#/register")) v.innerHTML = views.register();
  else if(hash.startsWith("#/recipes")) v.innerHTML = views.recipes();
  else if(hash==="#/recipe/new"){ if(authed())v.innerHTML=views.recipeForm(null); }
  else if(m=hash.match(/^#\/recipe\/(\d+)\/edit$/)){ if(authed())v.innerHTML=views.recipeForm(m[1]); }
  else if(m=hash.match(/^#\/recipe\/(\d+)$/)) v.innerHTML = views.recipeDetail(m[1]);
  else if(m=hash.match(/^#\/profile\/(\d+)\/(following|followers)$/)){ if(authed())v.innerHTML=views.followList(m[1],m[2]); }
  else if(m=hash.match(/^#\/profile\/(\d+)$/)){ if(authed())v.innerHTML=views.profile(m[1]); }
  else if(hash.startsWith("#/users")){ if(authed())v.innerHTML=views.users(); }
  else if(hash.startsWith("#/favorites")){ if(authed())v.innerHTML=views.favorites(); }
  else { v.innerHTML = views.recipes(); }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
render();
</script>
</body>
